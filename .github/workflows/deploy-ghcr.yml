name: Deploy GHCR

# Fork-friendly container deploy. Builds the production image and pushes it to
# the fork owner's GHCR namespace instead of the upstream `hkuds` namespace.
#
# Image: ghcr.io/<owner>/deeptutor
# Tags:  <input tag> (defaults to the project version) and latest

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (e.g. 1.7.0)
        required: true
        type: string
        default: "1.7.0"
      platforms:
        description: Target platforms
        required: false
        type: string
        default: "linux/amd64,linux/arm64"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push GHCR Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/deeptutor
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: ${{ inputs.platforms }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
