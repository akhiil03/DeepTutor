services:
  - type: web
    name: deeptutor-api
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    branch: dev
    # Free instances cannot attach a disk; deploy/render-start.sh restores and
    # uploads /app/data snapshots to Supabase Storage instead.
    plan: free
    region: oregon
    healthCheckPath: /health/ready
    autoDeployTrigger: "off"
    envVars:
      # FastAPI binds this port; the Dockerfile.render wrapper reads it.
      - key: PORT
        value: "10000"
      # Prompted once in the Render dashboard. Never commit the real value.
      - key: NVIDIA_API_KEY
        sync: false
      # Free durable storage: a private Supabase Storage snapshot bucket.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DEEPTUTOR_SNAPSHOT_BUCKET
        value: deeptutor-backups
